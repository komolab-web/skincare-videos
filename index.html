<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>肌悩み別スキンケア動画まとめ｜ニキビ・毛穴・シミ・乾燥・敏感肌 | SKIN NOTE</title>
  <meta name="description" content="YouTube のスキンケア動画を、肌悩み別にまとめたサイト。ニキビ・毛穴・シミ・乾燥・敏感肌・しわたるみを、クレンジング・化粧水・美容液・日焼け止めなどのステップ、レチノール・ビタミンCなどの成分、皮膚科医の解説・プチプラ・メンズなどのタグで絞り込んで、その場で再生できます。">
  <meta name="theme-color" content="#fbf6f1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="肌悩み別スキンケア動画まとめ | SKIN NOTE">
  <meta property="og:description" content="YouTube のスキンケア動画を、肌悩み・ステップ・成分別にまとめたサイト。">
  <meta property="og:site_name" content="SKIN NOTE｜肌悩み別スキンケア動画まとめ">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://komolab-web.github.io/skincare-videos/">
  <meta property="og:image" content="https://komolab-web.github.io/skincare-videos/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SKIN NOTE — 肌悩み別スキンケア動画まとめ（ニキビ・毛穴・シミ・乾燥・敏感肌・しわたるみ）">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // テーマ（ライト / ダーク）は描画前に反映して、ちらつきを防ぐ
    try {
      const t = localStorage.getItem('sn-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-title">SKIN NOTE</span>
        <span class="brand-sub">肌悩み別スキンケア動画まとめ</span>
      </span>
    </a>
    <div class="header-right">
      <p class="header-stats" id="header-stats"></p>
      <button type="button" class="scope-toggle" id="scope-toggle" role="switch" aria-checked="false" title="海外（英語）の動画も一覧に含める">
        <span class="scope-track" aria-hidden="true"><span class="scope-thumb"></span></span>
        <span class="scope-label"><span class="scope-long">海外も含める</span><span class="scope-short">＋海外</span></span>
      </button>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="ライト / ダークを切り替え" title="ライト / ダークを切り替え">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <nav class="view-tabs" id="view-tabs" role="tablist" aria-label="表示"></nav>

    <section class="hero" aria-label="肌悩みを選ぶ">
      <div class="facemap" id="facemap"></div>
      <div class="hero-side">
        <div class="hero-info" id="hero-info" aria-live="polite"></div>
        <nav class="concern-list" id="concern-list" aria-label="肌悩み"></nav>
      </div>
    </section>

    <div class="channel-row" id="channel-row" hidden>
      <p class="row-label">チャンネルで絞り込む</p>
      <div class="scroller">
        <nav class="channel-chips" id="channel-chips" aria-label="チャンネル"></nav>
      </div>
    </div>

    <div class="scroller">
      <nav class="step-tabs" id="step-tabs" role="tablist" aria-label="ステップ"></nav>
    </div>

    <section class="toolbar" aria-label="絞り込み">
      <div class="filter-line">
        <p class="filter-label">成分</p>
        <div class="chips" id="ingredient-chips"></div>
      </div>
      <div class="filter-line">
        <p class="filter-label">タグ</p>
        <div class="chips" id="tag-chips"></div>
      </div>
      <div class="toolbar-row">
        <div class="segmented" id="duration-filter" role="radiogroup" aria-label="長さ"></div>
        <label class="select">
          <span class="visually-hidden">並び順</span>
          <select id="sort">
            <option value="views">人気順</option>
            <option value="new">新しい順</option>
            <option value="short">短い順</option>
            <option value="long">長い順</option>
          </select>
        </label>
        <input class="search" id="search" type="search" placeholder="タイトル・チャンネル・商品名で検索" aria-label="検索">
      </div>
    </section>

    <div class="result-row">
      <p class="result-count" id="result-count"></p>
      <div class="segmented segmented-sm" id="open-mode" role="radiogroup" aria-label="動画の開き方">
        <button type="button" data-mode="site" aria-pressed="true">サイト内で再生</button>
        <button type="button" data-mode="youtube" aria-pressed="false">YouTube で開く</button>
      </div>
    </div>
    <section class="video-grid" id="video-grid"></section>
    <div class="more-row"><button type="button" class="btn btn-ghost" id="more" hidden>もっと見る</button></div>
  </main>

  <footer class="site-footer">
    <p>動画の権利は各投稿者に帰属します。動画は YouTube の埋め込み機能で表示しています。商品紹介には PR（案件）を含むものがあります。</p>
    <p>肌に合わないと感じたら使用を中止してください。炎症・強いかゆみ・急な変化があるときや治療中の方は、皮膚科医に相談してください。</p>
    <p class="footer-meta" id="footer-meta"></p>
  </footer>

  <dialog class="player" id="player">
    <div class="player-inner">
      <div class="player-frame"><iframe id="player-iframe" title="YouTube 動画" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
      <div class="player-info">
        <div>
          <h2 id="player-title"></h2>
          <p id="player-channel"></p>
        </div>
        <div class="player-stuck" id="player-stuck" hidden>
          <p>再生が始まらないときや「bot ではないことを確認」と出るときは、YouTube で開いてください（スマホはアプリで開きます）。</p>
          <div class="player-stuck-actions">
            <a id="player-stuck-link" class="btn" target="_blank" rel="noopener">YouTube で開く</a>
            <label class="player-stuck-remember"><input type="checkbox" id="always-youtube"> 次からは最初から YouTube で開く</label>
          </div>
        </div>
        <div class="player-actions">
          <a id="player-link" class="btn" target="_blank" rel="noopener">YouTube で開く</a>
          <button type="button" class="btn btn-ghost" id="player-close" autofocus>閉じる</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
